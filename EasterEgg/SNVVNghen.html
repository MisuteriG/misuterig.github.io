    <script>
        const img = document.getElementById('easter-egg-img');

        // Lấy kích thước của viewport
        let vw = Math.max(document.documentElement.clientWidth || 0, window.innerWidth || 0);
        let vh = Math.max(document.documentElement.clientHeight || 0, window.innerHeight || 0);

        // Vị trí ban đầu
        let x = Math.random() * (vw - img.width);
        let y = Math.random() * (vh - img.height);

        // Hướng di chuyển ban đầu (tốc độ)
        let dx = 2;
        let dy = 2;

        // Góc xoay ban đầu
        let rotation = 0;

        function animate() {
            // Cập nhật vị trí
            x += dx;
            y += dy;

            // Kiểm tra va chạm với các cạnh
            if (x + img.width >= vw || x <= 0) {
                dx = -dx; // Đảo ngược hướng di chuyển ngang
            }
            if (y + img.height >= vh || y <= 0) {
                dy = -dy; // Đảo ngược hướng di chuyển dọc
            }

            // Cập nhật góc xoay
            rotation += 1; // Tốc độ xoay

            // Áp dụng vị trí và hiệu ứng xoay
            img.style.left = x + 'px';
            img.style.top = y + 'px';
            img.style.transform = `rotate(${rotation}deg)`;

            // Lặp lại animation ở khung hình tiếp theo
            requestAnimationFrame(animate);
        }

        // Bắt đầu animation
        animate();
    </script>
